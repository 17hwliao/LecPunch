services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    env_file:
      - ./deploy/mongo.env
    command: ["--auth"]
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    env_file:
      - ./deploy/api.env
    depends_on:
      - mongo
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        VITE_LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:?请设置浏览器可访问的 LOGTO_ENDPOINT}
        VITE_LOGTO_APP_ID: ${LOGTO_WEB_APP_ID:-lecpunch-web}
        VITE_LOGTO_RESOURCE: ${LOGTO_API_RESOURCE:-https://api.lecpunch.lec.org}
        VITE_LOGTO_ORGANIZATION_ID: ${LOGTO_ORGANIZATION_ID:-lec-studio}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mongo-data:
